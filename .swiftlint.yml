# SwiftLint Configuration for ARCIntelligence
# ARC Labs Studio - Swift Package Standards

# Paths to include/exclude
included:
  - Sources
  - Tests
excluded:
  - .build
  - .swiftpm
  - Package.swift

# Disabled rules
disabled_rules:
  - todo # Allow TODO comments during development
  - trailing_comma # Allow trailing commas in multiline arrays/dicts

# Opt-in rules
opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - fatal_error_message
  - closure_spacing
  - contains_over_first_not_nil
  - explicit_acl
  - explicit_top_level_acl
  - file_header
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

# Rule configurations
line_length:
  warning: 120
  error: 150
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800
  ignore_comment_only_lines: true

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - db
    - to
    - x
    - y

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60

nesting:
  type_level:
    warning: 2
    error: 3

cyclomatic_complexity:
  warning: 10
  error: 15

# File header configuration
file_header:
  required_pattern: |
                    \/\/
                    \/\/  .*\.swift
                    \/\/  ARCIntelligence
                    \/\/
                    \/\/  Created by ARC Labs Studio on .*\.
                    \/\/

# Custom rules
custom_rules:
  # Enforce proper MARK usage
  mark_usage:
    name: "MARK Usage"
    regex: '\/\/\s*MARK:\s*[^-]'
    message: "MARK comments should use // MARK: - format"
    severity: warning

  # Discourage force unwrapping
  force_unwrap:
    name: "Force Unwrapping"
    regex: '!\s*(?!\/\/)'
    message: "Avoid using force unwrapping. Use if-let, guard-let, or optional chaining instead."
    severity: warning
    match_kinds:
      - identifier

  # Encourage explicit self for clarity in closures
  explicit_self_in_closure:
    name: "Explicit Self in Closures"
    regex: '\{\s*\[weak self\]\s+(?:.*\s+)?(?:self\?\.)?(?!self\.)\w+'
    message: "Use explicit 'self.' in closures with [weak self]"
    severity: warning

# Reporter type
reporter: "xcode"
